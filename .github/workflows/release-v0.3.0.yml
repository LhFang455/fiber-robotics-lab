name: Publish v0.3.0

on:
  push:
    tags: [v0.3.0]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install -r requirements-verified.txt
      - run: ruff check app.py fiber_robotics_sim tests
      - run: python -m pytest tests -p no:cacheprovider

  publish:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Publish verified snapshot
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # A user-authorized retag may replace the existing v0.3.0 release.
          # Verification must succeed first. Keep the newly pushed tag intact.
          if gh release view v0.3.0 >/dev/null 2>&1; then
            gh release delete v0.3.0 --yes
          fi
          gh release create v0.3.0 --verify-tag --title v0.3.0 --notes-file docs/releases/v0.3.0.md --latest
          test "$(gh release view v0.3.0 --json name --jq '.name')" = 'v0.3.0'
