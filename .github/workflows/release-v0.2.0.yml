name: Publish v0.2.0

on:
  push:
    branches: [master]
    paths: [.github/workflows/release-v0.2.0.yml]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v0.2.0
          persist-credentials: false
      - name: Verify frozen release commit
        run: test "$(git rev-parse HEAD)" = "495838bcdafbde74d27cc010c342fd319c65a0fa"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install -r requirements-verified.txt
      - run: ruff check app.py fiber_robotics_sim tests
      - run: python -m pytest tests -p no:cacheprovider

  publish:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v0.2.0
          persist-credentials: false
      - name: Publish verified snapshot
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view v0.2.0 --json body --jq '.body' > /tmp/release-notes.md; then
            sed -i '1s/^# release0.2.0$/# v0.2.0/' /tmp/release-notes.md
            gh release edit v0.2.0 --title v0.2.0 --notes-file /tmp/release-notes.md
          else
            sed '1s/^# release0.2.0$/# v0.2.0/' docs/releases/v0.2.0.md > /tmp/release-notes.md
            gh release create v0.2.0 --verify-tag --title v0.2.0 --notes-file /tmp/release-notes.md --latest
          fi
          test "$(gh release view v0.2.0 --json name --jq '.name')" = 'v0.2.0'
