<script>
(() => {
  'use strict';
  const cfg=JSON.parse(document.getElementById('demo-config').textContent);

  const maxSignal=Math.max(1e-9,...frames.flatMap(f=>f.signals.filter(Number.isFinite).map(Math.abs)));
  const sceneLabels=[];let gridLayer,asset=null,assetInspector=null;
  let renderer, scene, camera, updateScene=()=>{}, radius=100, target, framing=[], yaw=cfg.mechanism==='偏振态'?.18:['taxel','pressure'].includes(cfg.kind)?0:.65, elevation=cfg.mechanism==='偏振态'?.22:.65;

  function linePoints(value,points){value.geometry.dispose();value.geometry=new THREE.BufferGeometry().setFromPoints(points);}
  function marker(c,size=2){return mesh(new THREE.SphereGeometry(size,16,12),material(c,{emissive:c,emissiveIntensity:.15}));}
  function ring(c,size=3){const value=mesh(new THREE.TorusGeometry(size,.55,8,24),material(c,{depthTest:false}));value.rotation.x=Math.PI/2;value.renderOrder=8;return value;}
  function label(text,position,width=50){const canvas=document.createElement('canvas');canvas.width=256;canvas.height=48;const ctx=canvas.getContext('2d');ctx.fillStyle='#0d2130';ctx.fillRect(0,0,256,48);ctx.font='26px sans-serif';ctx.fillStyle='#d8eef7';ctx.textAlign='center';ctx.fillText(text,128,34);const sprite=new THREE.Sprite(new THREE.SpriteMaterial({map:new THREE.CanvasTexture(canvas),depthTest:false}));sprite.position.copy(position);sprite.scale.set(width,width*48/256,1);scene.add(sprite);sceneLabels.push(sprite);return sprite;}
  function fitCamera(){if(!renderer)return;const w=view.clientWidth,h=view.clientHeight;if(!w||!h)return;camera.aspect=w/h;camera.updateProjectionMatrix();renderer.setSize(w,h,false);const forward=vec(Math.cos(elevation)*Math.sin(yaw),Math.sin(elevation),Math.cos(elevation)*Math.cos(yaw)),right=vec(0,1,0).cross(forward).normalize(),up=forward.clone().cross(right),tangent=Math.tan(camera.fov*Math.PI/360);let distance=30;for(const point of framing){const offset=point.clone().sub(target);distance=Math.max(distance,offset.dot(forward)+Math.max(Math.abs(offset.dot(right))/(tangent*w/h),Math.abs(offset.dot(up))/tangent));}distance=distance*1.1+6;camera.position.copy(target).addScaledVector(forward,distance);camera.lookAt(target);renderer.render(scene,camera);}
  try{
    scene=new THREE.Scene();camera=new THREE.PerspectiveCamera(35,1,.1,10000);renderer=new THREE.WebGLRenderer({antialias:true,alpha:true});renderer.setPixelRatio(Math.min(devicePixelRatio,1.75));view.prepend(renderer.domElement);
    scene.add(new THREE.HemisphereLight(0xe7f8ff,0x173143,2.4));const light=new THREE.DirectionalLight(0xffffff,2.5);light.position.set(100,200,150);scene.add(light);
    const bounds=new THREE.Box3();
    asset=createLabAsset(THREE,scene,cfg.asset);
    if(cfg.kind==='skin'){
      const {width:w,height:h}=cfg;
      const surface=asset?null:new THREE.PlaneGeometry(w,h,32,24);
      if(surface){surface.rotateX(-Math.PI/2);surface.setAttribute('color',new THREE.BufferAttribute(new Float32Array(surface.attributes.position.count*3),3));

      const dots=cfg.sensors.map((_,i)=>{const dot=marker(0x86e8d4,1.4);return asset?asset.attach(i,dot):dot;});

      const selectedRing=Number.isInteger(cfg.inspection_channel)?ring(0xffffff,2.6):null;
      const indenters=frames[0].touches.map(()=>mesh(new THREE.SphereGeometry(5,24,16),material(0xe4eaf0,{metalness:.5})));

      function heightAt(x,y,f){return -Math.min(4.7,f.touches.reduce((sum,[tx,ty,force])=>sum+force*.35*Math.exp(-((x-tx)**2+(y-ty)**2)/(2*cfg.receptive_width**2)),0));}

        indenters.forEach((press,i)=>{const [x,y,force]=f.touches[i];press.position.set(x-w/2,heightAt(x,y,f)+5+(force>1e-9?.3:9)+(asset?asset.explosion*21:0),h/2-y);});
        centroid.visible=!!f.centroid;if(f.centroid)centroid.position.set(f.centroid[0]-w/2,2+(asset?asset.explosion*21:0),h/2-f.centroid[1]);
      };
      bounds.expandByPoint(vec(-w/2-8,asset?-14:-8,-h/2-8));bounds.expandByPoint(vec(w/2+8,asset?43:26,h/2+8));
    }else if(cfg.kind==='foot'){
      const patches=[],centers=[];
      if(asset){
        cfg.asset.bindings.forEach((b,i)=>{const patch=asset.parts.get(b.part).userData.mesh;patches.push(patch);asset.attach(i,marker(0xc9fff4,1.5));centers.push(asset.world(b.id));});
      }else{
      const sole=new THREE.Shape();sole.moveTo(-38,82);sole.quadraticCurveTo(-49,80,-47,25);sole.quadraticCurveTo(-42,3,-47,-40);sole.quadraticCurveTo(-57,-92,-3,-92);sole.quadraticCurveTo(56,-90,51,-42);sole.quadraticCurveTo(44,2,45,25);sole.quadraticCurveTo(49,80,38,82);sole.quadraticCurveTo(0,90,-38,82);
      const geometry=new THREE.ExtrudeGeometry(sole,{depth:7,bevelEnabled:true,bevelSize:2,bevelThickness:1,bevelSegments:3,curveSegments:24});geometry.rotateX(-Math.PI/2);geometry.rotateY(Math.PI);mesh(geometry,material(0x6b8795));

      }

      const palette=[0x56768b,0xe9b26c,0x7cc7cd,0x344758,0xa7bac9,0x4ecbb3,0x829bad],heights=[0,7,13,16,19,27,32];

        }

      const dots=[marker(0x67ead5,2.8),marker(0x67ead5,2.8),marker(0x9bbbea,2.8)];if(asset)dots.forEach((dot,i)=>asset.attach(i,dot));
      const fiber=line(0x90ead6,[vec(-14,30,0),vec(14,30,0),vec(23,30,34)]);
      updateScene=f=>{layers.forEach(({group,label},i)=>{group.position.y=heights[i]-(6-i)*15*f.explosion;group.position.x=i<3?cfg.lateral_offset_mm*4*(1-f.explosion):0;if(i<3)group.position.y-=cfg.insertion_deficit_mm*4*(1-f.explosion);label.visible=f.explosion>.15;});const y=layers[5].group.position.y+3;dots.forEach((dot,i)=>{if(!asset)dot.position.set(i===0?-14:i===1?14:23,y,i===2?34:0);dot.material.color.set(f.seated?i===2?0x9bbbea:0x67ead5:0x536975);});linePoints(fiber,dots.map((dot,i)=>asset?asset.world(cfg.asset.bindings[i].id):dot.position.clone()));};

  function stop(label='已暂停'){playing=false;cancelAnimationFrame(raf);el('play').textContent='播放演示';el('status').textContent=label;}
  function tick(now){if(!playing)return;if(document.hidden){stop();return;}clock+=(now-lastTime)*Number(el('speed').value);lastTime=now;const next=Math.min(frames.length-1,Math.floor(clock/playbackDuration*(frames.length-1)));if(next!==index)show(next);if(next===frames.length-1){stop('播放完成');return;}raf=requestAnimationFrame(tick);}
  function start(){if(index===frames.length-1)show(0);playing=true;clock=index/(frames.length-1)*playbackDuration;lastTime=performance.now();el('play').textContent='暂停';el('status').textContent='正在播放';raf=requestAnimationFrame(tick);}
  el('play').onclick=()=>playing?stop():start();
  el('replay').onclick=()=>{stop();show(0);start();};el('current').onclick=()=>{stop('已暂停 · '+currentLabel);show(cfg.initial_index);};
  slider.oninput=()=>{stop('已暂停 · 逐帧查看');show(Number(slider.value));};
  el('reset').onclick=()=>{yaw=defaultYaw;elevation=defaultElevation;fitCamera();};
  el('fullscreen').onclick=async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await el('panel').requestFullscreen();}catch{el('status').textContent='当前环境不支持全屏';}};
  document.addEventListener('fullscreenchange',()=>{el('fullscreen').textContent=document.fullscreenElement?'退出全屏':'全屏';fitCamera();});
  let pointer=null;
  view.addEventListener('pointerdown',event=>{pointer={id:event.pointerId,x:event.clientX,y:event.clientY,startX:event.clientX,startY:event.clientY,moved:false};view.setPointerCapture(event.pointerId);});
  view.addEventListener('pointermove',event=>{if(!pointer||pointer.id!==event.pointerId)return;if(Math.hypot(event.clientX-pointer.startX,event.clientY-pointer.startY)>5)pointer.moved=true;yaw-=(event.clientX-pointer.x)*.006;elevation=Math.max(.12,Math.min(1.42,elevation+(event.clientY-pointer.y)*.006));pointer.x=event.clientX;pointer.y=event.clientY;fitCamera();});
  const releasePointer=event=>{if(event.type==='pointerup'&&pointer&&!pointer.moved&&assetInspector)assetInspector.pick(event,camera);pointer=null;};view.addEventListener('pointerup',releasePointer);view.addEventListener('pointercancel',releasePointer);
  view.addEventListener('keydown',event=>{if(event.code==='Space'){event.preventDefault();playing?stop():start();return;}const pose=demoViewKey(event.code,yaw,elevation,{yaw:defaultYaw,elevation:defaultElevation});if(!pose)return;event.preventDefault();yaw=pose.yaw;elevation=pose.elevation;fitCamera();});
  new ResizeObserver(fitCamera).observe(view);
  new IntersectionObserver(entries=>{if(!entries[0].isIntersecting&&playing)stop('离开演示 · 已暂停');}).observe(el('panel'));
  document.addEventListener('visibilitychange',()=>{if(document.hidden)stop();});
  addEventListener('pagehide',()=>{stop();renderer?.dispose();});
  show(cfg.initial_index);
  if(assetInspector)assetInspector.initialize();
})();
</script>
</body></html>
